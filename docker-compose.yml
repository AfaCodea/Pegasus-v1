services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pegasus
      POSTGRES_PASSWORD: pegasus
      POSTGRES_DB: pegasus
    ports:
      - '5432:5432'
    volumes:
      - pegasus_db_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pegasus']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://pegasus:pegasus@db:5432/pegasus
      JWT_SECRET: dev-secret-change-me
      NODE_ENV: development
    ports:
      - '4000:4000'
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_PROXY_TARGET: http://server:4000
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules

volumes:
  pegasus_db_data:
  server_node_modules:
  client_node_modules:
